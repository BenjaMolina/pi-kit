# Copy this file to config.yaml in a CLIProxyAPI checkout.
# Keep config.yaml local: it contains client and management secrets.

host: ""
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

auth-dir: "~/.cli-proxy-api"

api-keys:
  - "replace-with-a-long-random-client-api-key"

remote-management:
  # Docker reaches the server through its bridge network. Keep this true when
  # using the Docker Compose profile, while the override keeps host ports local.
  allow-remote: true
  # CLIProxyAPI hashes a plaintext value on startup. Save the original value in
  # a password manager because the resulting bcrypt hash cannot be reversed.
  secret-key: "replace-with-a-long-random-management-key"
  disable-control-panel: false
  disable-auto-update-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

debug: false
logging-to-file: true
usage-statistics-enabled: false

# Dynamic-library plugins are trusted in-process code. Review the binary source
# and release before enabling it.
plugins:
  enabled: true
  dir: "plugins"
  configs:
    control-account-linux-amd64:
      enabled: true
